<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f4f6ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#111827" flood-opacity=".15"/></filter>
</defs>
<rect width="1400" height="760" rx="36" fill="url(#bg)"/>
<circle cx="1200" cy="80" r="180" fill="#ffe56b" opacity=".35"/>
<circle cx="1320" cy="650" r="240" fill="#d9e7ff" opacity=".45"/>

<text x="70" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1769ff" letter-spacing="2">PRODUCT MANAGEMENT CASE STUDY</text>
<text x="70" y="145" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#12151b">Commute Mode</text>
<text x="70" y="190" font-family="Arial, sans-serif" font-size="24" fill="#50555f">Making recurring mobility trips faster, simpler and more predictable.</text>

<rect x="70" y="225" width="200" height="42" rx="21" fill="#fff0ae"/><text x="170" y="253" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#25211a">USER-CENTRIC</text>
<rect x="285" y="225" width="190" height="42" rx="21" fill="#dce9ff"/><text x="380" y="253" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#17305c">DATA-INFORMED</text>
<rect x="490" y="225" width="185" height="42" rx="21" fill="#d9f5e3"/><text x="582" y="253" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#17472a">EXPERIMENT-LED</text>

<text x="70" y="330" font-family="Arial" font-size="20" font-weight="800" fill="#12151b">THE PRODUCT IDEA</text>
<text x="70" y="365" font-family="Arial" font-size="18" fill="#50555f">A saved commute shortcut that preserves live ETA/fare</text>
<text x="70" y="392" font-family="Arial" font-size="18" fill="#50555f">information and keeps booking confirmation explicit.</text>

<!-- Phone 1 -->
<g filter="url(#shadow)">
<rect x="725" y="105" width="190" height="410" rx="28" fill="#11151c"/>
<rect x="738" y="120" width="164" height="380" rx="20" fill="#fff"/>
<circle cx="820" cy="132" r="7" fill="#11151c"/>
<text x="752" y="166" font-family="Arial" font-size="11" fill="#6d737e">Good morning</text>
<text x="752" y="198" font-family="Arial" font-size="17" font-weight="800">Your commute,</text>
<text x="752" y="220" font-family="Arial" font-size="17" font-weight="800" fill="#1769ff">one tap away.</text>
<rect x="750" y="245" width="140" height="92" rx="16" fill="#17191d"/>
<text x="762" y="265" font-family="Arial" font-size="8" font-weight="700" fill="#aeb3bc">COMMUTE MODE</text>
<text x="762" y="289" font-family="Arial" font-size="14" font-weight="800" fill="#fff">Home → Office</text>
<text x="762" y="308" font-family="Arial" font-size="8" fill="#aeb3bc">Usually around 9:00 AM</text>
<text x="855" y="323" font-family="Arial" font-size="9" font-weight="700" fill="#fff">Book →</text>
<text x="752" y="365" font-family="Arial" font-size="10" font-weight="700">Book a ride</text>
<rect x="750" y="380" width="140" height="34" rx="10" fill="#f1f3f6"/>
<text x="760" y="402" font-family="Arial" font-size="9" fill="#666">⌖ Current pickup</text>
<rect x="750" y="422" width="140" height="34" rx="10" fill="#f1f3f6"/>
<text x="760" y="444" font-family="Arial" font-size="9" fill="#666">⌖ Where to?</text>
</g>
<text x="820" y="555" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#12151b">1 · Discover</text>

<!-- Phone 2 -->
<g filter="url(#shadow)">
<rect x="960" y="105" width="190" height="410" rx="28" fill="#11151c"/>
<rect x="973" y="120" width="164" height="380" rx="20" fill="#fff"/>
<circle cx="1055" cy="132" r="7" fill="#11151c"/>
<text x="988" y="170" font-family="Arial" font-size="15" font-weight="800">Confirm your commute</text>
<circle cx="1000" cy="215" r="5" fill="#1769ff"/><line x1="1000" y1="220" x2="1000" y2="275" stroke="#c8ccd4" stroke-width="2"/><circle cx="1000" cy="282" r="5" fill="#11151c"/>
<text x="1015" y="218" font-family="Arial" font-size="10" font-weight="700">Home</text><text x="1015" y="232" font-family="Arial" font-size="8" fill="#777">Current location</text>
<text x="1015" y="286" font-family="Arial" font-size="10" font-weight="700">Office</text><text x="1015" y="300" font-family="Arial" font-size="8" fill="#777">7.4 km</text>
<rect x="988" y="330" width="140" height="92" rx="14" fill="#f1f3f6"/>
<text x="998" y="354" font-family="Arial" font-size="8" fill="#777">Quick ride</text><text x="1118" y="354" text-anchor="end" font-family="Arial" font-size="9" font-weight="700">4 min</text>
<text x="998" y="380" font-family="Arial" font-size="8" fill="#777">Estimated fare</text><text x="1118" y="380" text-anchor="end" font-family="Arial" font-size="9" font-weight="700">₹118–₹136</text>
<rect x="988" y="438" width="140" height="36" rx="10" fill="#1769ff"/><text x="1058" y="461" text-anchor="middle" font-family="Arial" font-size="10" font-weight="800" fill="#fff">Confirm booking</text>
</g>
<text x="1055" y="555" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#12151b">2 · Confirm</text>

<!-- Phone 3 -->
<g filter="url(#shadow)">
<rect x="1195" y="105" width="135" height="410" rx="26" fill="#11151c"/>
<rect x="1205" y="120" width="115" height="380" rx="18" fill="#fff"/>
<circle cx="1262" cy="132" r="6" fill="#11151c"/>
<text x="1218" y="170" font-family="Arial" font-size="13" font-weight="800">Ride confirmed</text>
<rect x="1216" y="190" width="94" height="170" rx="14" fill="#dfe8e3"/>
<path d="M1230 305 C1245 240 1270 315 1296 220" fill="none" stroke="#1769ff" stroke-width="4"/>
<circle cx="1230" cy="305" r="9" fill="#1769ff"/><circle cx="1296" cy="220" r="9" fill="#11151c"/>
<rect x="1216" y="375" width="94" height="78" rx="12" fill="#f1f3f6"/>
<text x="1225" y="397" font-family="Arial" font-size="8" fill="#1769ff" font-weight="700">Driver arriving</text>
<text x="1225" y="422" font-family="Arial" font-size="18" font-weight="800">4 min</text>
<text x="1262" y="555" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#12151b">3 · Track</text>
</g>

<rect x="70" y="455" width="600" height="210" rx="24" fill="#fff" stroke="#e5e7eb"/>
<text x="95" y="492" font-family="Arial" font-size="16" font-weight="800" fill="#12151b">PM LENS</text>
<text x="95" y="525" font-family="Arial" font-size="14" fill="#50555f">Problem → Hypothesis → MVP → Experiment → Roadmap</text>
<line x1="95" y1="545" x2="640" y2="545" stroke="#e7e9ed"/>
<text x="95" y="580" font-family="Arial" font-size="12" fill="#6b7079">NORTH STAR</text>
<text x="95" y="604" font-family="Arial" font-size="20" font-weight="800" fill="#12151b">Repeat commute booking completion</text>
<text x="95" y="636" font-family="Arial" font-size="12" fill="#6b7079">Guardrails: cancellation · failed booking · rider trust</text>

<text x="1225" y="630" text-anchor="middle" font-family="Arial" font-size="14" fill="#50555f">A self-initiated portfolio project</text>
<text x="1225" y="657" text-anchor="middle" font-family="Arial" font-size="12" fill="#777">No proprietary company data used</text>
</svg>